name: COMPILAR APK ANDROID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar assinatura existente
        env:
          LIVENEXUS_KEYSTORE_BASE64: ${{ secrets.LIVENEXUS_KEYSTORE_BASE64 }}
          LIVENEXUS_KEYSTORE_PASSWORD: ${{ secrets.LIVENEXUS_KEYSTORE_PASSWORD }}
          LIVENEXUS_KEY_ALIAS: ${{ secrets.LIVENEXUS_KEY_ALIAS }}
          LIVENEXUS_KEY_PASSWORD: ${{ secrets.LIVENEXUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in LIVENEXUS_KEYSTORE_BASE64 LIVENEXUS_KEYSTORE_PASSWORD LIVENEXUS_KEY_ALIAS LIVENEXUS_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret de assinatura ausente: $name"
              exit 1
            fi
          done
          printf '%s' "$LIVENEXUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/livenexus-release.jks"
          chmod 600 "$RUNNER_TEMP/livenexus-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/livenexus-release.jks" \
            -storepass "$LIVENEXUS_KEYSTORE_PASSWORD" -alias "$LIVENEXUS_KEY_ALIAS" >/dev/null
      - name: Verificar interface nativa e rotas
        run: python3 verificar_login.py
      - name: Compilar APK release assinado
        env:
          LIVENEXUS_KEYSTORE_PATH: ${{ runner.temp }}/livenexus-release.jks
          LIVENEXUS_KEYSTORE_PASSWORD: ${{ secrets.LIVENEXUS_KEYSTORE_PASSWORD }}
          LIVENEXUS_KEY_ALIAS: ${{ secrets.LIVENEXUS_KEY_ALIAS }}
          LIVENEXUS_KEY_PASSWORD: ${{ secrets.LIVENEXUS_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveNexus-Controller-Android-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar APK assinado para download público
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          gh release create "v$VERSION" \
            "$APK#LiveNexus-Controller.apk" \
            --title "LiveNEXUS Controller v$VERSION" \
            --notes "APK Android assinado, compilado a partir do commit ${GITHUB_SHA}." \
            --latest
